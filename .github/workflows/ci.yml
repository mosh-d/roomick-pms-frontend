name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build type-checks the app as it compiles it, and writes the
      # route types (.next/types) the full type-check below reads.
      - name: Build
        run: npm run build

      - name: Typecheck everything
        run: npx tsc --noEmit
